# Пограничный nginx: HTTPS для flow.cargo-ibragim.ru.
#
# Стоит перед контейнером фронтенда и снимает TLS. Такой же конфиг работает
# на обоих серверах — какой из них сейчас принимает трафик, решает DNS.
#
# Сертификаты берутся из тома certs:
#   /etc/letsencrypt/live/<домен>/fullchain.pem
#   /etc/letsencrypt/live/<домен>/privkey.pem
# Это путь Let's Encrypt; если используется купленный сертификат, положите
# его файлы туда же под теми же именами.

# HTTP: только проверка Let's Encrypt и перевод на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name flow.cargo-ibragim.ru;

    # Проверка владения доменом при выпуске и продлении сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flow.cargo-ibragim.ru;

    ssl_certificate     /etc/letsencrypt/live/flow.cargo-ibragim.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flow.cargo-ibragim.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Год в HSTS означает: браузер больше не пойдёт на этот домен по http.
    # Включать только когда HTTPS точно работает на обоих серверах —
    # откатить это решение у уже побывавших посетителей нельзя.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Вложения к заказам: 3–5 МБ по ТЗ, с запасом на форму целиком.
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Тот же приём, что и во фронтенде: без resolver и переменной адрес
    # frontend запоминается при старте, и после его пересоздания edge отдаёт
    # 502 на весь сайт, пока nginx не перезапустят руками.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Без этого заголовка бэкенд считает соединение незашифрованным и
        # ставит cookie сессии без флага Secure.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
