name: CI

on:
  push:
    branches: [main, master, auto/ibra-dev]
  pull_request:
    branches: [main, master, auto/ibra-dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ibra_orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ibra_orders_test
      SESSION_SECRET: ci-test-secret
      UPLOAD_DIR: ./uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Pytest
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint src/ --ext .ts,.tsx

  # Сборка боевых образов. Живёт здесь, а не отдельным workflow, чтобы
  # `needs` физически не давал опубликовать образ, не прошедший тесты.
  #
  # Зачем вообще собирать в CI: на сервер должен приезжать ровно тот образ,
  # который прошёл тесты, а не пересобранный из того, что оказалось в рабочем
  # каталоге. Плюс выкладка перестаёт зависеть от свободной памяти сервера —
  # `vite build` просит 1.5-2.5 ГБ, и на машине поменьше это падало бы по OOM
  # ровно в момент обновления.
  images:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Владелец репозитория пишется как AziCodder, а Docker требует имена
      # реестра строго в нижнем регистре и отказывается собирать: «repository
      # name must be lowercase». Приводим сами, а не хардкодим, — иначе
      # переименование аккаунта сломает сборку молча.
      - name: Владелец в нижнем регистре
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Два тега на образ: latest и короткий SHA. latest — чтобы сервер
      # тянул «свежее», SHA — чтобы можно было откатиться на конкретную
      # сборку, не гадая, какая из них была вчера.
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/ibra-backend:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/ibra-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/ibra-frontend:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/ibra-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Показать, что выкладывать
        run: |
          echo "Образы опубликованы. На сервере:"
          echo "  IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml pull"
          echo "  IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d"
