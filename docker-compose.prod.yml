# Production overlay — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file:
      - .env
    volumes:
      - uploads:/var/lib/ibra/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} --no-owner --no-privileges
      -f /backups/ibra_orders_$$(date -u +%Y%m%d_%H%M%S).sql'

volumes:
  uploads:
