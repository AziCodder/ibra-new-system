# Production stack — standalone (not an overlay).
# Usage: copy .env.production.example → .env, then:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# На сервере образы НЕ собираются: там 2 ГБ памяти, а сборке фронтенда нужно
# 1.5-2.5 ГБ — `--build` упал бы по OOM ровно в момент выкладки. Образы
# собирает CI после прогона тестов и кладёт в ghcr.io; сервер их только тянет.
# Откат на конкретную сборку: IMAGE_TAG=<sha> docker compose ... up -d
#
# Один и тот же файл разворачивается на ОБОИХ серверах кластера. Отличаются
# только значения в .env: NODE_NAME, NODE_PUBLIC_IP и PEER_URL. Кто сейчас
# главный, а кто резерв, конфигом не задаётся — это знает сама база.

# Хранилище вложений: одинаково у backend и worker, поэтому вынесено сюда.
# Дублировать такой блок дважды — гарантия того, что однажды поправят один
# и забудут другой.
x-storage-env: &storage-env
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_PREFIX: ${S3_PREFIX:-files/}
  S3_PRIMARY_LABEL: ${S3_PRIMARY_LABEL:-HostKey S3}
  S3_PRIMARY_ENDPOINT: ${S3_PRIMARY_ENDPOINT:-}
  S3_PRIMARY_REGION: ${S3_PRIMARY_REGION:-}
  S3_PRIMARY_BUCKET: ${S3_PRIMARY_BUCKET:-}
  S3_PRIMARY_ACCESS_KEY: ${S3_PRIMARY_ACCESS_KEY:-}
  S3_PRIMARY_SECRET_KEY: ${S3_PRIMARY_SECRET_KEY:-}
  S3_MIRROR_LABEL: ${S3_MIRROR_LABEL:-Backblaze B2}
  S3_MIRROR_ENDPOINT: ${S3_MIRROR_ENDPOINT:-}
  S3_MIRROR_REGION: ${S3_MIRROR_REGION:-}
  S3_MIRROR_BUCKET: ${S3_MIRROR_BUCKET:-}
  S3_MIRROR_ACCESS_KEY: ${S3_MIRROR_ACCESS_KEY:-}
  S3_MIRROR_SECRET_KEY: ${S3_MIRROR_SECRET_KEY:-}

# Кластер: кто мы, где сосед и что делать при аварии.
x-cluster-env: &cluster-env
  NODE_NAME: ${NODE_NAME:-A}
  NODE_PUBLIC_IP: ${NODE_PUBLIC_IP:-}
  PEER_URL: ${PEER_URL:-}
  FAILOVER_ENABLED: ${FAILOVER_ENABLED:-false}
  PEER_FAILURES_BEFORE_FAILOVER: ${PEER_FAILURES_BEFORE_FAILOVER:-4}
  SYNC_REPLICATION: ${SYNC_REPLICATION:-true}
  SYNC_STANDBY_NAME: ${SYNC_STANDBY_NAME:-standby}
  SYNC_DEGRADE_AFTER_SECONDS: ${SYNC_DEGRADE_AFTER_SECONDS:-30}
  # Пороги отставания реплики. В асинхронном режиме отставание — это размер
  # возможной потери, поэтому оно должно быть видно и в админке, и в тревогах.
  REPLICATION_LAG_WARN_SECONDS: ${REPLICATION_LAG_WARN_SECONDS:-30}
  REPLICATION_LAG_ALERT_SECONDS: ${REPLICATION_LAG_ALERT_SECONDS:-120}
  DNS_PROVIDER: ${DNS_PROVIDER:-none}
  DNS_ZONE: ${DNS_ZONE:-cargo-ibragim.ru}
  DNS_RECORD: ${DNS_RECORD:-flow}
  DNS_TTL: ${DNS_TTL:-60}
  REGRU_LOGIN: ${REGRU_LOGIN:-}
  REGRU_PASSWORD: ${REGRU_PASSWORD:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  ALERT_CHAT_ID: ${ALERT_CHAT_ID:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Порт публикуется ТОЛЬКО на адрес внутри туннеля (10.8.0.1 на узле A,
    # 10.8.0.2 наB) — иначе резерв не сможет налиться с главного:
    # pg_basebackup ходит по обычному TCP, а не через compose-сеть.
    #
    # Привязка к конкретному адресу здесь принципиальна. Опубликованные
    # docker-порты идут мимо ufw (правила Docker стоят раньше в цепочке), так
    # что 0.0.0.0:5432 выставил бы базу в интернет вопреки фаерволу. Адрес
    # туннеля доступен только второму узлу кластера.
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ibra_orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Готовый образ из registry: на сервере 2 ГБ памяти, а сборка фронтенда
    # требует 1.5-2.5 ГБ — собирать здесь нельзя. build оставлен для CI и
    # локальной сборки: `docker compose build` пометит образ этим же именем.
    image: ${REGISTRY:-ghcr.io/azicodder}/ibra-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ibra_orders}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost}
      UPLOAD_DIR: /var/lib/ibra/uploads
      # Тот же каталог, что у воркера: ручной бэкап из админки и бэкап по
      # расписанию должны лежать в одном месте, иначе откат не найдёт файл,
      # снятый «не тем» контейнером.
      BACKUP_DIR: /var/lib/ibra/backups
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Links in Telegram notifications point here — set it to the address the
      # client actually opens, otherwise they lead to localhost.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      HEALTH_FRONTEND_BASE: http://frontend:80
      <<: [*storage-env, *cluster-env]
    volumes:
      - uploads:/var/lib/ibra/uploads
      - backups:/var/lib/ibra/backups
    depends_on:
      db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  # Фоновый воркер: часовые и суточные бэкапы, чистка по сроку хранения,
  # ночная проверка копии восстановлением и сверка двух S3-бакетов.
  # Поднимается на обоих серверах кластера, но работает только тот, чья база
  # сейчас главная (проверка `pg_is_in_recovery()`), — двойных прогонов нет.
  worker:
    # Тот же образ, что у backend, — отличается только командой запуска.
    image: ${REGISTRY:-ghcr.io/azicodder}/ibra-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    entrypoint: []
    command: python -m app.workers.scheduler
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ibra_orders}
      SESSION_SECRET: ${SESSION_SECRET}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /var/lib/ibra/uploads
      BACKUP_DIR: /var/lib/ibra/backups
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Europe/Moscow}
      BACKUP_HOURLY_RETENTION_DAYS: ${BACKUP_HOURLY_RETENTION_DAYS:-7}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      <<: [*storage-env, *cluster-env]
    volumes:
      - uploads:/var/lib/ibra/uploads
      - backups:/var/lib/ibra/backups
    depends_on:
      db:
        condition: service_healthy

  # Read-only прокси к Docker API — даёт админке («Логи процессов») доступ к
  # РЕАЛЬНЫМ логам контейнеров (`docker logs`), не монтируя docker.sock в сам
  # backend. Разрешены только GET /containers/json и /containers/{id}/logs
  # (CONTAINERS + LOGS), всё остальное (POST, exec, images, …) запрещено.
  # Наружу порт не публикуется — доступен лишь из compose-сети.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      LOGS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    image: ${REGISTRY:-ghcr.io/azicodder}/ibra-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Наружу фронтенд больше не публикуется: весь внешний трафик идёт через
    # edge, который снимает TLS. Порт остаётся на localhost для отладки.
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

  # Пограничный nginx: HTTPS для flow.cargo-ibragim.ru на обоих серверах.
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot
    depends_on:
      - frontend

  # Выпуск и продление сертификата Let's Encrypt. Проверяется дважды в сутки,
  # продление происходит за 30 дней до конца срока — просроченный сертификат
  # закрывает сайт целиком, и ловить это вручную нельзя.
  certbot:
    # Образ с плагином dns-cloudflare: он же умеет и webroot, так что подходит
    # обоим узлам. Резерву webroot не годится в принципе — Let's Encrypt
    # проверяет владение, обращаясь по домену, а домен указывает на активный
    # узел. Без проверки через DNS сертификат на резерве протух бы молча и
    # вскрылось бы это ровно в аварию.
    image: certbot/dns-cloudflare:latest
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot
    # `certbot renew` без флагов берёт способ проверки из настроек каждого
    # сертификата. Раньше здесь жёстко стоял --webroot, и он навязывался всем
    # сертификатам разом, ломая продление через DNS.
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do certbot renew --quiet;
      sleep 12h & wait $${!}; done'

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'pg_dump -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ibra_orders}
      --no-owner --no-privileges
      -f /backups/ibra_orders_$$(date -u +%Y%m%d_%H%M%S).sql'

volumes:
  pgdata:
  uploads:
  backups:
  certs:
  acme:
