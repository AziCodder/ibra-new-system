services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ibra_orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8011:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ibra_orders
      # Тот же каталог, что у воркера: ручной бэкап из админки и бэкап по
      # расписанию должны лежать в одном месте, иначе откат не найдёт файл,
      # снятый «не тем» контейнером.
      BACKUP_DIR: /var/lib/ibra/backups
    volumes:
      - ./backend:/app
      - ./:/workspace:ro
      - backups:/var/lib/ibra/backups
    depends_on:
      db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  # Фоновый воркер: бэкапы по расписанию и сверка двух S3-бакетов.
  # Отдельный процесс, а не поток внутри API: долгая задача (pg_dump,
  # проверка восстановлением) не должна конкурировать с обработкой запросов.
  # Задачи выполняются только на главном узле — воркер сам спрашивает у БД,
  # не реплика ли она.
  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.workers.scheduler
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ibra_orders
      BACKUP_DIR: /var/lib/ibra/backups
    volumes:
      - ./backend:/app
      - backups:/var/lib/ibra/backups
    depends_on:
      db:
        condition: service_healthy

  # Read-only прокси к Docker API — даёт админке («Логи процессов») доступ к
  # РЕАЛЬНЫМ логам контейнеров (`docker logs`), не монтируя docker.sock в сам
  # backend. Разрешены только GET /containers/json и /containers/{id}/logs
  # (CONTAINERS + LOGS), всё остальное (POST, exec, images, …) запрещено.
  # Наружу порт не публикуется — доступен лишь из compose-сети.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      LOGS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  backups:
