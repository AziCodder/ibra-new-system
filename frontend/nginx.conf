server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Встроенный DNS Docker. Без resolver + переменной nginx определяет адрес
    # backend ОДИН РАЗ при старте и держит его вечно: после пересоздания
    # контейнера (любое обновление) адрес меняется, а nginx продолжает ходить
    # на старый и отдаёт 502 на весь API. Сайт при этом открывается — падают
    # только запросы данных, из-за чего поломка выглядит как ошибка приложения.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Адрес в переменной заставляет nginx перечитывать DNS, а не кэшировать
        # его навсегда. При этом теряется автоподстановка пути, поэтому
        # $request_uri дописывается явно.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
